services:
  - type: web
    name: medisense
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate && npm run start:prod
    healthCheckPath: /api/governance/status
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: SQL_HOST
        sync: false
      - key: SQL_PORT
        value: "5432"
      - key: SQL_DB_NAME
        sync: false
      - key: SQL_USER
        sync: false
      - key: SQL_PASSWORD
        sync: false
      - key: SQL_SSL
        value: "true"
      - key: SQL_ADMIN_USER
        sync: false
      - key: SQL_ADMIN_PASSWORD
        sync: false
