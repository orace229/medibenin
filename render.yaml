services:
  - type: web
    name: medisense
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate && npm run start:prod
    healthCheckPath: /api/governance/status
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      # Neon Lakebase Postgres (preferred — set these in Render dashboard)
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # Neon Auth
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: NEON_AUTH_JWKS_URL
        sync: false
      # Neon AI Gateway
      - key: NEON_AI_GATEWAY_BASE_URL
        sync: false
      - key: NEON_AI_GATEWAY_TOKEN
        sync: false
      # Neon Functions
      - key: NEON_BRANCH_ID
        sync: false
      - key: NEON_FUNCTION_HOST_SUFFIX
        sync: false
      # Neon Realtime
      - key: NEON_REALTIME_URL
        sync: false
      - key: NEON_REALTIME_SECRET
        sync: false
      # Legacy SQL_* fallback (keep for drizzle-kit compatibility)
      - key: SQL_HOST
        sync: false
      - key: SQL_PORT
        value: "5432"
      - key: SQL_DB_NAME
        sync: false
      - key: SQL_USER
        sync: false
      - key: SQL_PASSWORD
        sync: false
      - key: SQL_SSL
        value: "true"
      - key: SQL_ADMIN_USER
        sync: false
      - key: SQL_ADMIN_PASSWORD
        sync: false
